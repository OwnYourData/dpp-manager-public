      identity: "Identity"
      administration: "Administration"
    passports: "Passports"
    all_passports: "All passports"
    read_passport: "Read a passport"
    new_passport: "New passport"
    product_types: "Product types"
    setup: "Setup"
    events: "Event log"
    vault: "Data file"
    identity: "My identity"
    settings: "Settings"
    lock: "Lock"

  help:
    title: "What this page is for"
    switch_off_hint: "You can switch these explanations off under Settings."
    close: "Close for now"

  unlock:
    passphrase: "Passphrase"
    open: "Open"
    existing:
      lead: "Enter your passphrase to open your data."
      purpose: "Everything this application knows is kept in one encrypted file. The passphrase is what turns that file back into readable data; without it nothing on this page works."
      no_recovery: "There is no way to recover the passphrase. Not by us, not by anyone. If it is lost, the data in the file is lost with it."
    new:
      lead: "No data file was found. Choose a passphrase and one will be created."
      warning_title: "Choose it carefully."
      warning_body: "This passphrase encrypts everything you will store here — your keys, your passports, your settings. Nobody can reset it and nobody can recover it. Write it down somewhere safe before you continue."
      passphrase: "New passphrase"
      passphrase_confirmation: "Repeat the passphrase"
      create: "Create the data file"
    strength:
      too_short: "Too short — at least %{count} characters."
      weak: "Weak. Longer is better than more complicated."
      fair: "Reasonable."
      strong: "Strong."

  vault:
    title: "Data file"
    created: "The data file has been created."
    seeded: "It already contains the product types this installation ships with: %{labels}."
    locked: "Locked."
    locked_after_idle: "Locked because the application sat unused."
    wrong_passphrase: "That passphrase does not open this file."
    wrong_current_passphrase: "The current passphrase is not correct."
    passphrase_too_short: "The passphrase must be at least %{count} characters long."
    passphrase_mismatch: "The two entries are not the same."
    passphrase_changed: "The passphrase has been changed."
    backup_created: "Backup copy written as %{filename}."
    backup_failed: "The backup copy could not be written: %{message}"
    help:
      purpose: "Everything this application holds lives in a single encrypted file. This page is about that file itself: where it is, how to take a copy of it, and how to change the passphrase that opens it."
      steps:
        - "Take a backup copy before anything you are unsure about."
        - "To move your work to another computer, copy the file there and open it with the same passphrase."
        - "Changing the passphrase rewrites the file. The old passphrase stops working immediately."
    file:
      title: "Where your data is"
      path: "File"
      size: "Size"
      hint: "This one file holds everything. Copying it to another computer takes your work with it — there is nothing else to carry."
    backup:
      title: "Backup copy"
      body: "Writes a complete, consistent copy beside the original. Safer than copying the file yourself, because a copy taken while the application is writing can be incomplete."
      action: "Create a backup copy"
      filename: "File name"
      size: "Size"
      created: "Created"
    passphrase:
      title: "Change the passphrase"
      body: "The file is written afresh with the new passphrase. The old one stops working as soon as this finishes."
      current: "Current passphrase"
      new: "New passphrase"
      confirmation: "Repeat the new passphrase"
      action: "Change the passphrase"

  dashboard:
    mandates:
      title:
        one: "One custody mandate needs a signature"
        other: "%{count} custody mandates need a signature"
      body: "A custodian holds these passports on a mandate that is running out. Renewing one is a single signature, and only you can make it — until then the passport stays readable but cannot be corrected or ended."
      expired: "expired"
      until: "until %{date}"
    title: "Overview"
    lead: "Your passports, and the file they are kept in."
    all_events: "Show the full event log"
    recent_events: "Recently"
    help:
      purpose: "The starting point: the passports you are working on, the file that holds them, and what has happened here recently."
      steps:
        - "Lock the application when you leave the machine."
        - "The event log records everything that happens here."
    state:
      title: "Your data file"
      file: "Location"
      opened_at: "Opened at"
      kdf_profile: "Key profile"
    passports:
      title: "Your passports"
      none: "No passports yet."
      all:
        one: "The one passport"
        other: "All %{count} passports"
    setup:
      title: "Start here"
      body: "Before a passport can leave this machine, three things have to be settled: which passport service to write to, an identity of your own, and where the passports are to be kept. It takes a few minutes and each screen explains itself."
      action: "Set it up"

  events:
    title: "Event log"
    empty: "Nothing has happened yet."
    chain_ok: "The log is intact — %{count} entries, each one sealed against the one before it."
    chain_broken: "The log has been altered. The chain first breaks at entry %{id}."
    truncated: "Showing the most recent %{shown} of %{total} entries."
    help:
      purpose: "A record of everything that has happened in this application: when it was opened, when it was locked, what was changed."
      steps:
        - "Each entry carries a seal over the entry before it, so an entry that is removed or edited afterwards shows up."
        - "Failed unlock attempts appear on the next successful unlock — the log is inside the file, so it cannot be written while the file is closed."
    filter:
      kind: "Kind"
      all: "All"
      apply: "Filter"
    column:
      when: "When"
      kind: "What"
      detail: "Details"
    kinds:
      vault_created: "Data file created"
      vault_opened: "Opened"
      vault_open_failed: "Failed attempts to open"
      vault_locked: "Locked"
      passphrase_changed: "Passphrase changed"
      backup_created: "Backup copy created"
      setting_changed: "Setting changed"
      identity_minted: "Identity created"
      identity_imported: "Identity imported"
      identity_keys_secured: "Keys confirmed as stored"
      identity_keys_exported: "Key file written"
      service_configured: "DPP Service set"
      custodian_configured: "Custodian set"
      setup_completed: "Setup completed"
      product_type_added: "Product type added"
      product_type_changed: "Product type changed"
      product_type_removed: "Product type removed"
      product_type_fetched: "Structure fetched"
      product_type_fetch_failed: "Structure could not be fetched"
      passport_minted: "Passport identifier created"
      passport_mint_failed: "Passport identifier could not be created"
      passport_keys_secured: "Passport keys confirmed as stored"
      passport_keys_exported: "Passport key file written"
      passport_submitted: "Passport submitted"
      passport_submit_failed: "Passport could not be submitted"
      passport_updated: "Passport corrected"
      passport_update_failed: "Correction could not be sent"
      passport_retired: "Passport withdrawn from the service"
      passport_retire_failed: "Passport could not be withdrawn"
      passport_revoked: "Passport identifier revoked"
      passport_revoke_failed: "Passport identifier could not be revoked"
      passport_read: "Passport read"
      passport_read_failed: "Passport could not be read"
      passport_delegated: "Custody mandate signed"
      passport_delegation_renewed: "Custody mandate renewed"
      passport_delegation_failed: "Custody mandate refused"
      passport_delegation_checked: "Custody mandate compared"
      passport_custody_moved: "Passport handed to another custodian"
      passport_custody_move_failed: "Handover refused"
      passport_endpoint_moved: "Passport identifier points at the new custodian"
      passport_endpoint_move_failed: "Passport identifier could not be moved"

  passports:
    title: "Passports"
    lead: "The passports on this machine. Nothing here has been submitted anywhere yet."
    empty: "No passports yet."
    no_types: "There is no product type to make a passport from yet."
    to_types: "Add a product type"
    new_of: "New: %{label}"
    new_title: "New passport"
    new_lead: "Filling in a %{label}."
    edit_title: "Edit passport"
    back: "Back to the list"
    edit: "Open"
    created: "Passport created."
    saved: "Saved."
    removed: "“%{label}” was deleted."
    choose_type_first: "Choose which kind of passport this is first."
    not_valid_yet: "It does not satisfy the structure yet — that is fine for a draft."
    more_problems: "…and %{count} more."
    problem:
      show:
        one: "Show the one point that is open"
        other: "Show the %{count} points that are open"
      one_of: "must be one of: %{values}"
      unnamed: "does not satisfy the structure"
      missing_class: "nothing in the passport is a %{name} yet"
    not_checked: "It could not be checked: the SOyA component is not answering."
    identifier:
      blank: "is required"
      not_a_url: "has to be a web address"
      not_https: "has to start with https://"
      too_long: "is %{length} characters, %{over} over the 50 the EU registry allows. A shorter host or a shorter serial is the only way down."
      has_query: "must not carry a ? or a # — an identifier is a path, and anything after it is data"
      bad_digital_link: "starts with an application identifier, so it is read as a GS1 Digital Link: /01/ and a 14-digit GTIN, optionally followed by /10/ a batch, /21/ a serial or /22/ a variant"
      bad_path: "has to be either a GS1 Digital Link (/01/ and a 14-digit GTIN) or a path under a domain you control, using only letters, digits, hyphen, underscore and full stop"
      granularity_contradicts: "contradicts the identifier, whose path says %{from_path}"
    envelope:
      legend: "What the passport says about the product"
      identifier: "Product identifier"
      identifier_hint: "The address printed on the product, and the one the passport is reached by. At most 50 characters — that is the whole budget."
      granularity: "This passport describes"
      granularity_hint: "For a GS1 Digital Link the path already says which; the field is filled in from it and cannot disagree."
      granularity_derived: "Taken from the identifier path."
      facility: "Facility (optional)"
      facility_hint: "The identifier of the place of manufacture, if you carry one."
      operator: "Economic operator"
      operator_hint: "Your identity. Not editable here — it comes from the setup."
      schema: "Semantic model"
      dpp_id: "Passport identifier"
      identifier_frozen: "Part of the passport identifier that has been created, so it can no longer be changed."
    mint:
      title: "The passport identifier"
      action: "Create the passport identifier"
      minted_at: "Created"
      endpoint: "Where it points"
      to_keys: "Show the keys again"
      already: "This passport already has an identifier."
      not_minted: "This passport has no identifier yet."
      envelope_first: "The product identifier and what the passport describes have to be filled in first — they go inside the identifier and cannot be changed afterwards."
      no_endpoint: "There is no DPP Service configured, so there is nowhere for the identifier to point."
      failed: "The identifier could not be created: %{message}"
      frozen: "cannot be changed once the passport identifier has been created"
      keys_not_secured: "The keys of this identifier have not been confirmed as stored yet."
      warning_title: "This step cannot be undone."
      warning_body: "A document is published to the registry, and it says the passport can be read at %{endpoint}. Both the product identifier and that address are fixed from then on — moving the passport elsewhere later means a new identifier and a new data carrier."
      confirm: "Create the identifier now? It will point at %{endpoint} and cannot be changed afterwards."
      help:
        purpose: "The passport gets an identifier of its own, separate from your identity: it names the product, your identity signs on its behalf."
        steps:
          - "It is created here on this machine, so its keys never travel. The registry publishes the document and keeps no secret."
          - "The product identifier is written into it, which is why the envelope has to be complete first."
          - "The address it points at is compared by the DPP Service when you submit — an identifier created for one place cannot be submitted to another."
    keys:
      title: "The keys of this passport"
      lead: "The identifier of “%{label}” has been created. Its two keys are below, once."
      did: "Passport identifier"
      endpoint: "Points at"
      endpoint_hint: "Where the passport will be readable. The DPP Service checks this address against where you submit, so it is part of the identifier rather than a note about it."
      warning_title: "You will not see these again."
      warning_body: "The registry published the document and kept no secret. Whoever holds the document key can change what this identifier points at; the revocation key is the only way to end it. Nobody can issue them a second time."
      export_body: "Written as a file next to your data file, in %{directory}. It is plain text — that is what a key backup is."
      confirm_label: "I have stored both keys somewhere safe."
      action: "Continue"
      must_confirm: "Tick the box once the keys are somewhere safe."
      secured: "Noted. The keys are not shown again."
      already_secured: "Confirmed as stored on %{when}. The keys are not shown again."
      help:
        purpose: "These two keys belong to the product, not to you as an operator — they are what makes it possible to move or retire this passport later."
        steps:
          - "The document key changes where the identifier points. The revocation key ends it."
          - "Store them the way you stored your identity keys. A passport whose keys are lost can still be read, but never moved or retired."
    correct:
      action: "Send the correction"
      done: "The correction has been sent. The service holds this version now."
      corrected_at: "Last corrected"
      differs: "This version differs from the one the service holds."
      in_step: "The service holds this version."
      editable_again: "You can change the answers. They stay here until you send the correction."
      nothing_to_send: "Nothing has changed since the last submission."
      not_submitted: "This passport has not been submitted, so there is nothing to correct."
      confirm: "Send this version to %{service}? The previous one is kept there as an earlier version."
    custody:
      title: "Who holds this passport"
      custodian: "Custodian"
      collection: "Collection"
      signed_at: "Mandate signed"
      expires_at: "Mandate valid until"
      act: "Covers"
      jti: "Mandate reference"
      not_yet: "The mandate is signed when the passport is submitted. Until then nobody is holding anything."
      submitted: "Submitted. It is held at %{custodian} under a mandate you signed."
      expired: "The mandate has expired. The passport stays readable, but the service can no longer change or end it until you sign a fresh one."
      expiring: "The mandate runs out in %{days} days. Renewing it is one signature and can be done at any time."
      renew: "Sign a fresh mandate"
      check: "Compare with the service"
      confirm_renew: "Sign a fresh mandate for this passport? It replaces the one the service holds; the previous one stops working."
      renewed: "A fresh mandate was signed and accepted. It is valid until %{date}."
      in_step: "The service holds the mandate you signed. It is valid until %{date}."
      differs: "The service holds a different mandate (reference %{jti}, valid until %{date}) from the one recorded here. Signing a fresh one settles it."
      service_holds_nothing: "The service holds no mandate it can read for this passport. Sign a fresh one."
      not_custodial: "This passport is kept in the DPP Service’s own database, so there is no mandate for it."
      no_custodian: "This passport was made for a custodian, but no custodian is configured any more. Set one up under Setup before submitting it."
      check_unsupported: "%{service} cannot say which mandate it holds — that question does not exist there. Nothing about the mandate itself changes; what is shown here still stands."
      expired_first: "The mandate has expired, so the service can no longer write to the custodian holding this passport. Sign a fresh mandate first — it takes one click and changes nothing else."
      move_title: "Hand this passport to another custodian"
      move_hint: "Signs a mandate for the new custodian, has the service move the document there, and then points the passport’s own identifier at it. The identifier printed on the product does not change and keeps resolving throughout."
      move_action: "Hand it over"
      confirm_move: "Hand this passport to the custodian you named? The document is moved and the identifier follows."
      moved: "The passport is held at %{custodian} now, and its identifier says so."
      move_half_done: "The passport has been moved to %{custodian}, but its identifier still names %{previous}. Anyone resolving it is sent to the wrong host. The keys are here, so this can be finished."
      finish_move: "Point the identifier at the new custodian"
      finish_first: "This passport is halfway through a handover. Finish that first."
      nothing_to_finish: "There is no handover waiting to be finished."
      already_there: "The passport is already held there."
      no_keys: "The passport’s keys are not here, so its identifier cannot be pointed anywhere."
      endpoint_failed: "The document was moved, but the identifier could not be pointed at the new custodian: %{message}"
      release_previous: "Release the previous custodian right away"
      release_hint: "Off by default. While the previous custodian keeps serving, there is no moment in which the passport cannot be read — it answers until the identifier has followed. Releasing at once ends that overlap and, for a second or two, the identifier names a host that no longer serves the passport."
      not_submitted: "The passport has not been submitted yet, so nobody is holding it."
      no_service_did: "%{service} does not publish the identifier a mandate has to name. Configure the service again under Setup so it can be read."
      sign_failed: "The mandate could not be signed: %{message}"
      help:
        purpose: "A custodian stores this passport, and the authority for that is a statement you signed: this service may keep this one passport in this one collection, for this long. No password is handed over, and nothing about it can be used for any other passport."
        steps:
          - "The mandate is signed with your identity key, here, and only ever names one passport."
          - "It runs out after ninety days. A fresh one is one signature; nothing about the passport changes."
          - "Withdrawing it at the custodian stops this service writing to this passport, and nothing else."
    retire:
      title: "End this passport"
      hint: "For a product at the end of its life. The service stops serving the passport and keeps the final state as history; then this application revokes the passport’s identifier with the keys it holds, and that identifier stops resolving anywhere, for good."
      button: "End the passport"
      finish: "Revoke the identifier now"
      confirm: "End “%{label}”? The service stops serving it and the identifier is revoked. Neither can be undone."
      confirm_revoke: "Revoke the identifier now? It will stop resolving anywhere, for good."
      done: "The passport is ended: withdrawn from the service and its identifier revoked."
      half_done: "The service no longer serves this passport, but its identifier is still live. The keys are still here, so this can be finished."
      already: "This passport has already been ended."
      not_minted: "This passport has no identifier, so there is nothing to end. Delete it instead."
      no_keys: "The passport was withdrawn from the service, but there is no revocation key here, so its identifier cannot be revoked."
      revoke_failed: "The passport was withdrawn from the service, but the identifier could not be revoked: %{message}"
    states:
      draft: "draft"
      minted: "identifier created"
      submitted: "submitted"
      retired: "ended"
    retired:
      title: "This passport has been ended."
      body: "Ended on %{when}. The service no longer serves it, and its identifier is revoked — it resolves nowhere. What is left here is the record."
      half_body: "Ended on %{when}. The service no longer serves it; its identifier has not been revoked yet."
      not_served: "The service no longer serves this passport, so there is nothing left to correct."
      custody_over: "The passport is gone from the custodian. What stands above is the mandate that applied while it was there."
      badge: "ended"
    submit:
      title: "Submitting"
      action: "Submit to the DPP Service"
      done: "Submitted. The passport is now readable at the service."
      already: "This passport has already been submitted."
      submitted_at: "Submitted"
      submitted_to: "To"
      no_service: "No DPP Service is configured. That is set up under Setup."
      no_identity: "There is no identity to sign the submission with."
      mint_first: "The passport needs its own identifier before it can be submitted."
      endpoint_mismatch: "This passport's identifier points at %{endpoint}, but it would be kept at %{service}. The service compares the two and refuses a mismatch, and neither side can be corrected afterwards — the identifier was frozen when the passport was minted. A passport minted for one place cannot be moved to another by changing a setting."
      refused: "The service refused it (HTTP %{status}): %{problems}"
      unreachable: "The service could not be reached: %{message}"
      document_failed: "The document could not be built: %{reason}"
      token_failed: "The submission could not be signed with your identity: %{message}"
      not_submitted_yet: "Not submitted yet."
      warning_title: "This hands the passport over."
      warning_body: "The document goes to %{service}, signed with your identity. From then on that service serves it under the identifier the product carries."
      confirm: "Submit to %{service} now?"
      reasons:
        no_transformation: "this product type does not name a transformation, so there is nothing to build the elements from"
        transformation_not_fetched: "the transformation has not been fetched yet — fetch the product type again"
        transformation_failed: "the SOyA component could not run the transformation"
        transformation_did_not_yield_elements: "the transformation did not return a list of elements"
        no_reverse_transformation: "this product type does not name a transformation for reading, so a passport cannot be read back into its form"
        reverse_transformation_not_fetched: "the transformation for reading has not been fetched yet — fetch the product type again"
        transformation_did_not_yield_answers: "the transformation did not return a set of answers"
        invalid_address: "that is not an address this application can read from"
        unreachable: "no answer from that address"
        timeout: "it did not answer in time"
        tls_failed: "the encrypted connection could not be established"
      help:
        purpose: "The document is assembled here and sent in one request: the envelope from your settings and your identity, the elements from the product type's transformation."
        steps:
          - "It is signed with your identity, not with the passport's keys — the passport names a thing, you are the one who speaks for it."
          - "The service checks that the passport's identifier resolves and that it points at the service's own host before it stores anything."
          - "What comes back is stored here too, so you can see what was accepted without the service being reachable."
    granularities:
      model: "a model — every item of this type"
      batch: "a batch"
      item: "one individual item"
    columns:
      label: "Name"
      type: "Kind"
      content: "Content"
      changed: "Changed"
    form:
      legend: "This passport"
      label: "Name"
      label_hint: "How you will recognise it in the list. Yours alone — the product's own identifier is the next field."
      nothing_entered: "Nothing entered yet."
      fields_entered: "%{count} fields filled in."
      save: "Save"
      save_and_close: "Save and close"
    remove:
      title: "Delete this passport"
      hint: "It exists only on this machine, so deleting it has no effect anywhere else."
      button: "Delete"
      confirm: "Delete “%{label}”?"
      minted: "This passport has an identifier of its own now. Deleting the row here would take its keys with it, and nobody could ever revoke that identifier. End the passport first."
      retired_hint: "The passport is ended and its identifier revoked. What is left here is a record, and a record may go."
    help:
      purpose: "The form comes from the product type’s SOyA structure — which fields it has, what they are called and what counts as a valid answer are all decided there, not here."
      steps:
        - "A draft is saved even when it is incomplete. What is missing is said, not enforced."
        - "The answers are kept flat, the way you typed them. The standard’s element tree is derived from them when the passport is submitted."

