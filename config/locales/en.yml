en:
  app:
    name: "DPP Manager"
    tagline: "Create and manage digital product passports on your own machine."
    footer_html: "OwnYourData · Version %{version} — everything is kept in one %{link} on this machine."
    footer_link: "encrypted file"

  locales:
    en: "English"
    de: "Deutsch"

  nav:
