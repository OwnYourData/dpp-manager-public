        purpose: "The one screen in this application that shows secrets. It exists because a key that is only in the data file is one lost passphrase away from gone."
        steps:
          - "Write the file, or copy the two keys into a password manager."
          - "The revocation key is the emergency brake — treat it like a spare house key, not like a note on the fridge."
    custodian:
      heading: "Who holds your passports?"
      what_it_is: "A custodian is not storage space like a cloud folder. It is a data intermediary: it holds the document, and what it may do with it is one signed sentence about one passport — which you can take back at any time, without asking anybody."
