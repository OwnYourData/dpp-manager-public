        purpose: "An identity in this system is a key pair. The private half stays on this machine and signs what you send; the public half is published so that the service can check the signature. There is nothing to register and nobody to ask."
        steps:
          - "Creating one takes a moment and needs a network connection."
          - "The next step shows you the keys once. That is the only time."
    keys:
      heading: "Write these down before you continue"
      warning_title: "You will not see them again."
      warning_body: "These two keys exist here and nowhere else. Nobody can send them to you again — not the registry, not us. Store them somewhere you will still find them in five years."
      your_identity: "Your identity"
      what_they_are: "The document key signs. The revocation key ends this identity, and only it can. Keep them apart from each other if you can."
