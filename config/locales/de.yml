      help:
        purpose: "Ein Verwahrer speichert diesen Pass, und die Berechtigung dafür ist eine Aussage, die Sie unterschrieben haben: dieser Service darf diesen einen Pass in dieser einen Sammlung ablegen, für diese Dauer. Es wird kein Passwort übergeben, und nichts daran lässt sich für einen anderen Pass verwenden."
        steps:
          - "Das Mandat wird hier mit Ihrem Identitätsschlüssel unterschrieben und nennt immer genau einen Pass."
          - "Es läuft nach neunzig Tagen ab. Ein neues ist eine Unterschrift; am Pass ändert sich dabei nichts."
          - "Es beim Verwahrer zu widerrufen stoppt genau diesen Service für genau diesen Pass — und sonst nichts."
