      minted: "Kennung angelegt"
      submitted: "übermittelt"
      retired: "beendet"
    retired:
      title: "Dieser Pass ist beendet."
      body: "Beendet am %{when}. Der Service stellt ihn nicht mehr bereit, und seine Kennung ist widerrufen — sie löst nirgendwo mehr auf. Was hier bleibt, ist die Aufzeichnung."
