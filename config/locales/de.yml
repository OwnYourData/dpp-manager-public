      finish_move: "Kennung auf den neuen Verwahrer ausrichten"
      finish_first: "Bei diesem Pass läuft eine Übergabe. Schließen Sie die zuerst ab."
      nothing_to_finish: "Es wartet keine Übergabe darauf, abgeschlossen zu werden."
